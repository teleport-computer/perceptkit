[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perceptkit"
version = "0.1.0"
description = "从设备信号判断:有没有发生值得留意的事、值不值得叫醒一次 agent、以及该怎么把此刻的状况讲给它听。不采集数据、不碰存储、不调模型。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["perception", "agent", "proactive", "wake", "context"]

# 零依赖:全部标准库。tests/test_purity.py 用 AST 扫描盯着这条,别手改这里而不更新那条测试。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/perceptkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 没有这行,pytest 会去 import 已安装的 perceptkit,而不是这个仓库的 src/。
# 后果:改坏了源码、测试照样全绿(它测的是站点包里的旧版本)。踩过一次。
pythonpath = ["src"]
